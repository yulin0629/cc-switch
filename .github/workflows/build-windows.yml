name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - local/build

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_BUILD_JOBS: "2"
        run: |
          pnpm tauri build

      - name: Collect Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe,*.zip | Copy-Item -Destination artifacts/ -Force
          if (Test-Path "src-tauri/target/release/cc-switch.exe") {
            Copy-Item "src-tauri/target/release/cc-switch.exe" -Destination artifacts/ -Force
          }
          Get-ChildItem -Path artifacts

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-x64
          path: artifacts/*
          if-no-files-found: error
